<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Athirah Karir</title>
        <link rel="stylesheet" href="campuscard.css">
    </head>

    <body>
        <!-- ================= HEADER ================= -->
    <header class="navbar">
        <div class="logo">
            <div class="logo-box">
            <img src="logo.jpg" alt="Logo Athirah">
            </div>
            <span>Athirah Karir</span>
        </div>
        <nav>
            <a href="#kampus">Kampus</a>
            <a href="#jurusan">Jurusan</a>
            <a href="#prestasi">Prestasi</a>
            <a href="#tentang">Tentang</a>
        </nav> 
    </header>

    <!-- ================= KAMPUS ================= -->

        <section class="campus-container" id="campusContainer">
            <!-- CARD 1 -->
            <article class="campus-card">
                <div class="campus-top">
                    <div>
                        <h2>Universitas Hasanuddin</h2>
                        <p class="location">
                            ♧ Makassar, Sulawesi Selatan
                        </p>
                    </div>
                    <span class="student-count">
                        ♙ 4 alumni
                    </span>
                </div>
                <div class="campus-info">
                    <span class="type">
                        PTN
                    </span>
                </div>
                         <p class="major">
                        Jurusan: Farmasi, Ilmu Komunikasi,
                        Arsitektur...
                        </p>

                <button class="detail-btn">
                    Lihat alumni →
                </button>

            </article>

        </section>
    </body>
</html>
